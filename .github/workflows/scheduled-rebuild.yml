# Rebuild the site on Netlify every day, so the homepage's "Next event" and
# event list (pulled from the shared Google Calendar at build time) stay current.
#
# One-time setup:
#   1. Netlify → Site configuration → Build & deploy → Build hooks → "Add build
#      hook" (branch: main). Copy the URL it gives you.
#   2. GitHub repo → Settings → Secrets and variables → Actions → New repository
#      secret, named NETLIFY_BUILD_HOOK, with that URL as the value.
#
# Note: GitHub pauses scheduled workflows in repos with no activity for 60 days;
# re-enable it from the Actions tab if that happens. You can also run it by hand
# there ("Run workflow").
name: Scheduled rebuild

on:
  schedule:
    - cron: "0 11 * * *" # daily, 11:00 UTC (5–6am in Chicago)
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set; see setup notes in this file." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK"
